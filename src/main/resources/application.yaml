server:
  port: 8080

spring:
  application:
    name: fleetmanagement
  datasource:
    url: ${DB_URL:jdbc:postgresql://google/fleet?cloudSqlInstance=mynewproject-508104:us-central1:fleet&socketFactory=com.google.cloud.sql.postgres.SocketFactory}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Qwerty@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FleetManagementHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        connection:
          provider_disables_autocommit: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}
