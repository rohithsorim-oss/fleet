services:
  postgres:
    image: 'postgres:16'
    container_name: fleet-postgres
    restart: unless-stopped
    ports:
      - '5435:5432'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-fleet}'
      - 'POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password'
      - 'POSTGRES_USER=${POSTGRES_USER:-admin}'
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fleet-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-fleet}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleet-backend
    restart: unless-stopped
    ports:
      - '${SERVER_PORT:-8080}:8080'
    env_file:
      - .env.local
    environment:
      - 'DB_URL=jdbc:postgresql://postgres:5432/fleet'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fleet-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8080/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  postgres_data:
    driver: local

networks:
  fleet-network:
    driver: bridge
